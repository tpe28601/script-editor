<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3f5f9">
<link rel="icon" href="data:,">
<title>Script Editor</title>
<link rel="stylesheet" href="/ui-kit.css">
<link rel="stylesheet" href="/app.css">
<!-- 深淺色／強調色：網址 ?theme=&accent=（Hub 嵌入時帶入）> 本機記憶 > 跟隨系統 -->
<script src="/tb-theme.js" data-tb-tool></script>
</head>
<body class="tb-app">
<header class="tool-topbar tb-hide-embedded">
  <div class="tool-topbar__brand"><span class="tb-card__icon"><i data-tb-icon="file-code" data-size="17"></i></span>Script Editor</div>
  <div class="tb-row tb-row--end tool-topbar__controls">
    <span class="tb-small tb-muted" id="ver">…</span>
    <button class="tb-btn tb-btn--icon tb-hidden" id="standalone-update" type="button" hidden></button>
    <button class="tb-btn tb-btn--icon" id="theme-toggle" type="button" aria-label="切換主題"><i data-tb-icon="sun"></i></button>
  </div>
</header>

<div class="se-project-actions tb-theme-toolbar" role="group" aria-label="專案工具列">
  <div class="se-project-group" role="group" aria-label="開啟專案">
    <button class="tb-btn" id="btn-new" type="button"><i data-tb-icon="plus"></i>新專案</button>
    <button class="tb-btn" id="btn-open" type="button"><i data-tb-icon="folder-open"></i>開啟…</button>
    <button class="tb-btn" id="btn-sample" type="button"><i data-tb-icon="bookmark"></i>載入範例</button>
  </div>
  <div class="se-project-group" role="group" aria-label="區塊包">
    <button class="tb-btn" id="btn-pack-export" type="button" title="把自訂區塊與專案打包成 .sepack.json, 分享給同事">匯出區塊包…</button>
    <button class="tb-btn" id="btn-pack-import" type="button" title="匯入同事給的 .sepack.json（先預覽）">匯入區塊包…</button>
  </div>
  <div class="se-project-group" role="group" aria-label="驗證、儲存與匯出專案">
    <button class="tb-btn" id="btn-validate" type="button"><i data-tb-icon="check"></i>驗證</button>
    <button class="tb-btn" id="btn-save" type="button"><i data-tb-icon="save"></i>儲存</button>
    <button class="tb-btn" id="btn-export-gui" type="button">匯出 GUI .bat</button>
    <button class="tb-btn tb-btn--primary" id="btn-export" type="button"><i data-tb-icon="download"></i>匯出 .bat</button>
  </div>
</div>

<main class="se-main">
  <div class="se-project-field">
    <label for="proj-name">專案名稱</label>
    <input class="tb-input tb-input--mono" id="proj-name" type="text"
           aria-describedby="proj-name-hint" spellcheck="false">
    <span class="tb-small tb-muted" id="proj-name-hint">使用 ASCII 字元，名稱會用於匯出檔名。</span>
    <span class="tb-badge" id="state-badge">新專案</span>
  </div>

  <div class="se-cols">
    <!-- ============ 區塊庫 ============ -->
    <aside class="tb-card se-lib">
      <div class="tb-card__head">
        <h2 class="tb-card__title">區塊庫</h2>
        <span class="tb-card__label">拖到任務, 或點一下加入選取中的任務；自訂區塊可雙擊編輯</span>
      </div>
      <div class="tb-input-row">
        <input class="tb-input" id="lib-search" type="search" placeholder="搜尋區塊…">
        <button class="tb-btn tb-btn--sm" id="btn-add-block" type="button" title="新增自訂區塊">＋自訂</button>
      </div>
      <div class="se-liblist" id="lib-list"></div>
    </aside>

    <!-- ============ 任務（Task）清單 ============ -->
    <section class="tb-card se-mid">
      <div class="tb-card__head">
        <h2 class="tb-card__title">任務（匯出腳本的主選單）</h2>
        <button class="tb-btn tb-btn--sm" id="btn-add-task" type="button">＋新增任務</button>
      </div>
      <div id="task-list" class="se-tasklist"></div>
    </section>

    <!-- ============ 內容面板 ============ -->
    <aside class="tb-card se-insp">
      <div class="tb-card__head"><h2 class="tb-card__title" id="insp-title">專案設定</h2></div>
      <div id="insp-body" class="se-insp-body"></div>
    </aside>
  </div>
</main>

<!-- ============ 開啟專案 / 內建範例 彈窗（共用, 標題由 JS 設） ============ -->
<div class="se-mask tb-theme-backdrop hidden" id="open-mask">
  <div class="se-modal tb-theme-dialog se-project-picker" role="dialog" aria-modal="true" aria-labelledby="open-title">
    <div class="se-modal__head">
      <span id="open-title">開啟專案</span>
      <button class="tb-btn tb-btn--icon" id="open-close" type="button" aria-label="關閉"><i data-tb-icon="x"></i></button>
    </div>
    <div class="se-modal__body"><div id="open-list" class="se-picker-content"></div></div>
  </div>
</div>

<!-- ============ 自訂區塊編輯彈窗 ============ -->
<div class="se-mask tb-theme-backdrop hidden" id="blk-mask">
  <div class="se-modal tb-theme-dialog" style="width:720px">
    <div class="se-modal__head">
      <span id="blk-title">新增自訂區塊</span>
      <button class="tb-btn tb-btn--sm tb-btn--ghost" id="blk-close" type="button">✕</button>
    </div>
    <div class="se-modal__body">
      <div class="se-fgrid">
        <label>id（小寫英數字）<input class="tb-input tb-input--mono" id="blk-id" spellcheck="false"></label>
        <label>名稱（ASCII, 會進匯出腳本）<input class="tb-input" id="blk-name"></label>
        <label>分類<input class="tb-input" id="blk-cat" value="自訂"></label>
        <label class="se-fspan">說明（可中文, UI 顯示用）<input class="tb-input" id="blk-desc"></label>
      </div>
      <label class="se-flabel">指令（單行；可用 {TOOLS} {BUNDLE} 與 ${參數名}）
        <textarea class="tb-input se-ta" id="blk-cmd" rows="2" spellcheck="false"></textarea></label>
      <label class="se-flabel">執行時顯示的短指令（選填；空白 = 由指令自動產生，例如 Tool64W.exe ${ARGS}）
        <input class="tb-input tb-input--mono" id="blk-display" spellcheck="false" maxlength="120"></label>
      <label class="se-flabel">或 raw 批次行（每行一條；進階, 與指令二擇一；可用 {LBL} {TASK}）
        <textarea class="tb-input se-ta" id="blk-raw" rows="4" spellcheck="false"></textarea></label>
      <div class="se-fgrid">
        <label>可接受 rc（逗號分隔）<input class="tb-input tb-input--mono" id="blk-rc" value="0"></label>
        <label class="tb-check" style="align-self:end"><input type="checkbox" id="blk-bundle"> 需要工具包（{TOOLS}）</label>
        <label class="tb-check" style="align-self:end"><input type="checkbox" id="blk-restarts"> 會重開機（GUI 按鈕標 Restarts）</label>
      </div>
      <div class="se-subhead">參數</div>
      <div id="blk-params"></div>
      <button class="tb-btn tb-btn--sm" id="blk-add-param" type="button">＋參數</button>
    </div>
    <div class="se-modal__foot">
      <span class="tb-small tb-danger hidden" id="blk-err" style="margin-right:auto"></span>
      <button class="tb-btn tb-btn--primary" id="blk-save" type="button">儲存區塊</button>
    </div>
  </div>
</div>

<!-- ============ 區塊包 匯出 / 匯入 彈窗（共用, 內容由 JS 產生） ============ -->
<div class="se-mask tb-theme-backdrop hidden" id="pack-mask">
  <div class="se-modal tb-theme-dialog" style="width:760px">
    <div class="se-modal__head">
      <span id="pack-title">區塊包</span>
      <button class="tb-btn tb-btn--sm tb-btn--ghost" id="pack-close" type="button">✕</button>
    </div>
    <div class="se-modal__body" id="pack-body"></div>
    <div class="se-modal__foot">
      <span class="tb-small tb-danger hidden" id="pack-err" style="margin-right:auto"></span>
      <button class="tb-btn tb-btn--primary" id="pack-go" type="button">確定</button>
    </div>
  </div>
</div>
<input type="file" id="pack-file" accept=".json,.sepack.json" class="hidden">

<div class="tb-toast-area"><div class="tb-toast hidden" id="toast" role="status"></div></div>

<script src="/tb-icons.js"></script>
<script src="/tb-standalone-update.js"></script>
<script src="/app.js"></script>
</body>
</html>
